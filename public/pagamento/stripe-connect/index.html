<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stripe Connect — Rally Up</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root { --primary:#255943; --accent:#C7D941; --surface:#1A1A1A; --text:#fff; --muted:rgba(255,255,255,.72); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);
      background:linear-gradient(180deg,var(--primary),#163528);
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .card{max-width:420px;width:100%;background:var(--surface);border-radius:24px;padding:28px;text-align:center}
    h1{font-size:1.35rem;font-weight:800;margin-bottom:10px;color:var(--accent)}
    p{color:var(--muted);line-height:1.5;margin-bottom:18px}
    a.btn{display:block;background:var(--accent);color:#1A1A1A;border-radius:60px;padding:14px;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Stripe Connect</h1>
    <p id="sub">Voltando ao painel do clube…</p>
    <a class="btn" id="open" href="setmatch://clube/financeiro">Abrir painel</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var clubeId = params.get('clubeId') || '';
      var deep = 'setmatch://clube/financeiro' + (clubeId ? ('?clubeId=' + encodeURIComponent(clubeId)) : '');
      document.getElementById('open').href = deep;
      if (params.get('refresh') === '1') {
        document.getElementById('sub').textContent = 'Onboarding incompleto. Abrindo o app para tentar de novo…';
      }
      var intent = 'intent://clube/financeiro#Intent;scheme=setmatch;package=com.fabricaapps.setmatch;end';
      var isAndroid = /Android/i.test(navigator.userAgent || '');
      try { location.href = isAndroid ? intent : deep; } catch (e) {}
      setTimeout(function () { try { location.href = deep; } catch (e2) {} }, 350);
    })();
  </script>
</body>
</html>
